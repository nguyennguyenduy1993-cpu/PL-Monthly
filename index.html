<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P&amp;L Monthly</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box}
:root{--ink:#17191C;--ink2:#4A4F55;--mut:#71767D;--mut2:#9A9EA4;--line:#E6E6E2;--line2:#F0F0EC;--bg:#F6F6F3;--card:#fff;--blue:#2F6BD4;--blue2:#EEF3FC;--blue3:#9DB7E8;--good:#0E8A6E;--goodbg:#EAF5F0;--bad:#B3402F;--badbg:#FBEDEA;--warn:#C4881F;--warnbg:#FBF3E6}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
button,select,input{font-family:inherit;font-size:inherit}
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px;padding:9px 20px;flex-wrap:wrap}
.brand{font-size:16px;font-weight:700;letter-spacing:-.02em;margin-right:6px;white-space:nowrap}
.tabs{display:flex;gap:2px;background:#F1F1ED;border-radius:9px;padding:3px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:6px 9px;border-radius:7px;color:var(--ink2);cursor:pointer;font-weight:500;white-space:nowrap}
.tabs button.on{background:#fff;color:var(--blue);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sp{flex:1}
.ctl{display:flex;align-items:center;gap:6px}
.ctl label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2);font-weight:600}
.sel{height:32px;border:1px solid #DCDCD6;border-radius:8px;background:#fff;padding:0 10px;font-weight:600;color:var(--ink);cursor:pointer}
.mp{position:relative}
.mp .sel{min-width:128px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px}
.mp .sel::after{content:"▾";color:var(--mut2);font-size:10px}
.pop{position:absolute;right:0;top:38px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.12);padding:12px;width:268px;z-index:40}
.pop .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pop .m{border:1px solid #DCDCD6;background:#fff;border-radius:7px;padding:7px 0;cursor:pointer;font-weight:600;color:var(--ink2)}
.pop .m.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pop .m.na{color:#C4C7CB;border-style:dashed}
.pop .q{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pop .q button{flex:1;border:1px solid #DCDCD6;background:#FAFAF8;border-radius:7px;padding:6px 4px;cursor:pointer;font-size:12px;color:var(--ink2)}
.btn{height:32px;border:1px solid #DCDCD6;background:#fff;border-radius:8px;padding:0 10px;cursor:pointer;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:#2559B8;color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:#C4C7CB;display:inline-block}
.dot.ok{background:var(--good)}.dot.off{background:var(--warn)}
.navrow{display:flex;align-items:center;gap:8px;padding:0 20px 8px}
.nav{display:flex;gap:4px;overflow-x:auto;flex:1}
.btn.sm{height:28px;font-size:12px}
.nav a{padding:5px 11px;border-radius:999px;color:var(--mut);text-decoration:none;font-weight:600;font-size:12px;white-space:nowrap;cursor:pointer}
.nav a.on{background:var(--blue2);color:var(--blue)}
main{padding:16px 20px 48px}
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.head h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.head .per{font-size:13px;color:var(--mut);font-weight:500}
.blk{margin-bottom:22px;scroll-margin-top:110px}
.bt{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.bt h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.bt .n{font-size:11px;font-weight:700;color:var(--mut2);background:#EDEDE8;border-radius:5px;padding:2px 6px}
.bt .s{font-size:12px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut2);font-weight:600}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.ds{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.d{font-size:11px;font-weight:600;padding:2px 6px;border-radius:5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.good{color:var(--good)}.bad{color:var(--bad)}.flat{color:var(--mut)}
.d.good{background:var(--goodbg)}.d.bad{background:var(--badbg)}.d.flat{background:#F1F1ED}
.g{display:grid;gap:12px;align-items:start}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g21{grid-template-columns:minmax(0,1fr) minmax(300px,380px)}
@media(max-width:900px){.g21{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.ct{font-size:13px;font-weight:700;margin-bottom:2px}
.cs{font-size:11.5px;color:var(--mut);margin-bottom:10px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut2);font-weight:600;text-align:right;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FAFAF8}
th:first-child,td:first-child,th.t{text-align:left}
th.grp{text-align:center;border-bottom:1px solid var(--line2);color:var(--ink2)}
td{padding:6px 9px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
td.t{text-align:left;white-space:normal;min-width:140px}
tr.b td{font-weight:700}
tr.tot td{font-weight:700;background:#FAFAF8;border-top:1px solid var(--line)}
tr.me td{background:#F5F8FE;font-weight:700}
tr.l1 td:first-child{padding-left:20px}tr.l2 td:first-child{padding-left:34px;color:var(--ink2)}tr.l3 td:first-child{padding-left:48px;color:var(--mut)}
td.sep,th.sep{border-left:1px solid var(--line)}
.star{color:var(--warn);font-weight:700;cursor:help}
.empty{background:#fff;border:1px dashed #DCDCD6;border-radius:12px;padding:14px 16px;color:var(--mut);display:flex;align-items:center;gap:10px;justify-content:space-between}
.hb{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(60px,1.6fr) 62px 46px;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
.hb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tr{height:12px;background:#F1F1ED;border-radius:4px;overflow:hidden}
.hb .f{height:100%;background:var(--blue3);border-radius:4px}
.hb .f.me{background:var(--blue)}.hb .f.cp{background:#C9CCD1}
.hb .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}.hb .p{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
.stk{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:center;margin-bottom:6px;font-size:12px}
.stk .bar2{display:flex;height:20px;border-radius:5px;overflow:hidden;background:#F1F1ED}
.seg{height:100%;color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;overflow:hidden}
.c1{background:#0B3D91}.c2{background:#1F56B8}.c3{background:#2F6BD4}.c4{background:#4A87E8}.c5{background:#7FA8EE}.c6{background:#0BA37F}.c7{background:#C4881F}.c8{background:#B3402F}
.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--mut);margin-top:6px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.find{list-style:none;margin:0;padding:0}
.find li{display:grid;grid-template-columns:8px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);line-height:1.5}
.find li:last-child{border-bottom:0}
.find li i{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--mut2)}
.find li.bad i{background:var(--bad)}.find li.good i{background:var(--good)}.find li.warn i{background:var(--warn)}
.find .a{color:var(--mut);font-size:12px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart .ax{fill:var(--mut2);font-size:10px}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.1);border-radius:8px;padding:7px 9px;font-size:11.5px;line-height:1.5;z-index:5;white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(23,25,28,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
.mbox{background:#fff;border-radius:14px;width:min(860px,100%);padding:20px 22px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.mbox h3{margin:0 0 4px;font-size:17px}
.mbox .sub{color:var(--mut);font-size:12px;margin-bottom:14px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.drop{border:1.5px dashed #C9CCD1;border-radius:10px;padding:22px;text-align:center;color:var(--mut);cursor:pointer}
.drop:hover{border-color:var(--blue);color:var(--blue)}
.ok{color:var(--good);font-weight:700}.no{color:#C4C7CB}
.msg{padding:9px 12px;border-radius:8px;font-size:12.5px;margin-top:10px}
.msg.warn{background:var(--warnbg);color:#7A5512}.msg.err{background:var(--badbg);color:var(--bad)}.msg.ok2{background:var(--goodbg);color:var(--good)}
textarea{width:100%;min-height:150px;border:1px solid #DCDCD6;border-radius:8px;padding:10px;font-family:ui-monospace,monospace;font-size:12px}
.mtabs{display:flex;gap:4px;margin-bottom:12px}
.mtabs button{border:0;background:#F1F1ED;border-radius:7px;padding:6px 12px;cursor:pointer;font-weight:600;color:var(--ink2)}
.mtabs button.on{background:var(--blue);color:#fff}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17191C;color:#fff;padding:9px 16px;border-radius:8px;z-index:200;font-size:12.5px}
@media(max-width:760px){.top{position:static}.bar{padding:8px 12px}.navrow{padding:0 12px 8px}main{padding:12px}.brand{width:100%}}

.pop .hint{font-size:11px;color:var(--mut2);margin-top:8px;line-height:1.4}
.btn svg{width:14px;height:14px}
.kwh{font-size:12px;font-variant-numeric:tabular-nums}
.kwh .kh,.kwh .kr{display:grid;grid-template-columns:52px minmax(200px,1fr) 80px 80px 80px 86px 80px 64px;gap:10px;align-items:center;padding:4px 0}
.kwh .kh{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut2);font-weight:600;border-bottom:1px solid var(--line)}
.kwh .kh span:nth-child(n+3),.kwh .kr span:nth-child(n+3){text-align:right}
.kwh .kr{border-bottom:1px solid var(--line2)}.kwh .kr.on{background:#F5F8FE}
.kwh .bar2{display:flex;height:20px;border-radius:5px;overflow:hidden}
@media(max-width:760px){.kwh .kh,.kwh .kr{grid-template-columns:44px 1fr 70px}.kwh .kh span:nth-child(3),.kwh .kh span:nth-child(4),.kwh .kh span:nth-child(5),.kwh .kr span:nth-child(3),.kwh .kr span:nth-child(4),.kwh .kr span:nth-child(5){display:none}}
tr.grp td{background:#FAFAF8;border-top:1px solid var(--line)}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mini{padding:10px 12px}
.mini .mh{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mini .ct{margin:0;font-size:12px}
.mini .mv{font-size:17px;font-weight:700;letter-spacing:-.02em;margin:2px 0 2px;font-variant-numeric:tabular-nums}
.mini .mv span{font-size:10.5px;color:var(--mut2);font-weight:600}
.dsel{display:flex;align-items:center;gap:4px}
.dsel .sel{min-width:76px}
.mbox td span.ok,.mbox td span.no{display:inline-block;margin:0 1px;font-size:11px}

.nt{margin-top:12px}
.ct.sub{margin:14px 0 6px;font-size:12px;font-weight:600;color:var(--ink)}
.sb{display:inline-block;width:56px;height:6px;background:#ECECE8;border-radius:3px;margin-right:8px;vertical-align:middle;overflow:hidden}.sb i{display:block;height:100%;background:var(--blue)}
.ysel{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:8px;font-size:12px}.ysel label{font-weight:600}
.ysel select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid #D6D7D2;border-radius:6px;background:#fff;min-width:220px}
.chart.big{position:relative;height:240px}.chart.big svg{width:100%;height:240px;display:block}
.ytab td.on,.ytab th.on,th.on{color:var(--blue)}.ytab td.on{background:#F3F7FE}
.ytab tr.b td{font-weight:600}

.chart .vl{fill:#1F4FA8;font-size:10px;font-weight:600}
table.shr .hbar{height:10px;background:#F0F0EC;border-radius:5px;overflow:hidden}table.shr .hbar i{display:block;height:100%;border-radius:5px;background:#C9CCD1}
table.shr .hbar i.me{background:var(--blue)}table.shr .hbar i.glx{background:#9DB8EC}table.shr tr.me td{font-weight:600}

body.locked>*:not(.lock){visibility:hidden}
.lock{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#F6F6F3}
.lbox{width:min(360px,92vw);background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px 26px;display:grid;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.lbrand{font-size:20px;font-weight:700;color:var(--ink)}.lsub{font-size:12px;color:var(--mut2);margin:-8px 0 6px}
.lbox label{display:grid;gap:5px;font-size:12px;font-weight:600;color:var(--ink)}
.lbox input:not([type=checkbox]),.lbox select{font:inherit;font-size:14px;font-weight:400;padding:9px 10px;border:1px solid #D6D7D2;border-radius:8px;background:#fff}
.lbox input:focus,.lbox select:focus{outline:2px solid var(--blue);outline-offset:-1px}
.lbox .lrem{display:flex;align-items:center;gap:8px;font-weight:400}
.lerr{min-height:16px;font-size:12px;color:#B3402F}.lbox .btn{justify-content:center;padding:10px}
#bOut{margin-right:8px;margin-left:auto}#bOut+#bData{margin-left:0}

.kwh .seg{white-space:nowrap;overflow:hidden;text-overflow:clip}.kwh .seg.sm{font-size:9.5px;letter-spacing:-.2px}

.mhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}.mhead h3{margin:0}.ysel2{font-size:12px;font-weight:600;display:flex;gap:8px;align-items:center}.ysel2 select{font:inherit;padding:4px 8px;border:1px solid #D6D7D2;border-radius:6px}
</style>
</head>

<script>// Vista "Marketing Report" (BO003) parser. Input: pages = [{items:[{str,x,w,y,h}]}] with y measured top-down.
(function (root) {
  const NUM = /^-?[\d,]*\.?\d+$/;
  const num = (s) => (s == null ? null : Number(String(s).replace(/,/g, '')));
  function lines(page) {
    const its = page.items.filter((i) => i.str && i.str.trim() !== '').slice().sort((a, b) => a.y - b.y || a.x - b.x);
    const L = [];
    for (const it of its) {
      let ln = L.find((l) => Math.abs(l.y - it.y) <= Math.max(2.8, (it.h || 8) * 0.5));
      if (!ln) { ln = { y: it.y, items: [] }; L.push(ln); }
      ln.items.push(it);
    }
    L.sort((a, b) => a.y - b.y);
    for (const ln of L) {
      ln.items.sort((a, b) => a.x - b.x);
      const cells = [];
      for (const it of ln.items) {
        const c = cells[cells.length - 1];
        const gap = c ? it.x - c.x1 : 99;
        const sp = Math.max(2.2, (it.h || 8) * 0.6);
        if (c && gap < sp) { c.t += (gap > 0.9 && !/\s$/.test(c.t) && !/^\s/.test(it.str) ? ' ' : '') + it.str; c.x1 = it.x + it.w; }
        else cells.push({ x: it.x, x1: it.x + it.w, t: it.str });
      }
      cells.forEach((c) => (c.t = c.t.replace(/\s+/g, ' ').trim()));
      ln.cells = cells.filter((c) => c.t !== '');
      ln.text = ln.cells.map((c) => c.t).join(' ');
    }
    return L.filter((l) => l.cells.length);
  }
  const textIn = (ln, x0, x1) => ln.cells.filter((c) => c.x >= x0 - 1 && c.x < x1).map((c) => c.t).join(' ').trim();
  const tokens = (s) => s.split(' ').filter(Boolean);
  // split "name n1 n2 ... nk" -> {name, nums}
  function tail(s, k) {
    const t = tokens(s); if (t.length < k + 1) return null;
    const ns = t.slice(-k); if (!ns.every((x) => NUM.test(x))) return null;
    return { name: t.slice(0, -k).join(' '), nums: ns.map(num) };
  }
  function parseVista(pages) {
    const all = []; pages.forEach((p, pi) => lines(p).forEach((l) => { l.page = pi; all.push(l); }));
    const out = { cinemaName: null, from: null, to: null, year: null, month: null, kpi: {}, films: [], channel: [], lead: [], group: null, payBO: [], payCO: [], cls: [], items: [], warnings: [] };
    // header
    const first = all.filter((l) => l.page === 0).slice(0, 3);
    for (const l of first) { const c = l.cells.find((c) => /^Galaxy/i.test(c.t)); if (c) { out.cinemaName = c.t; break; } }
    const per = all.find((l) => /From\s+\w+\s+\d{2}\/\d{2}\/\d{4}/.test(l.text));
    if (per) {
      const m = per.text.match(/From\s+\w+\s+(\d{2})\/(\d{2})\/(\d{4}).*?To\s+\w+\s+(\d{2})\/(\d{2})\/(\d{4})/);
      if (m) { out.from = `${m[3]}-${m[2]}-${m[1]}`; out.to = `${m[6]}-${m[5]}-${m[4]}`; out.year = +m[3]; out.month = +m[2];
        if (m[1] !== '01' || m[4] !== '01') out.warnings.push('Kỳ báo cáo không bắt đầu/kết thúc ngày 01: ' + out.from + ' → ' + out.to); }
    }
    // base info
    const LAB = { bo_sales: 'Box Office Sales', adm: 'Box Office Admits incl Comps', comps: 'Comps', paid_adm: 'Paid Admits', trans_ticket: 'Transactions with Tickets',
      co_gross: 'Concession Sales Gross', co_net: 'Concession Sales Net', items_sold: 'Quantity of Items Sold', trans_co: 'Transactions with Concessions',
      voucher_sales: 'Voucher Sales', sundries: 'Box Office Sundries', total_trans: 'Total Transactions', occupancy: 'Occupancy Rate %',
      adm_strike: 'Admissions Strike Rate %', trans_strike: 'Transaction Strike Rate %', avg_co_trans: 'Average Value per Concession Trans.' };
    const esc = (s) => s.replace(/[.*+?^${}()|[\]\\%]/g, '\\$&');
    for (const [k, lab] of Object.entries(LAB)) {
      outer: for (const l of all) for (let j = 0; j < l.cells.length - 1; j++) {
        if (l.cells[j].t === lab && NUM.test(l.cells[j + 1].t)) { out.kpi[k] = num(l.cells[j + 1].t); break outer; }
      }
      if (out.kpi[k] == null) { // fallback: label and value glued in one string
        const re = new RegExp('(?:^|\\s)' + esc(lab) + '\\s+(-?[\\d,]*\\.?\\d+)');
        for (const l of all) { const m = l.text.match(re); if (m && !(k === 'comps' && /incl Comps/.test(l.text.slice(0, m.index + 6)))) { out.kpi[k] = num(m[1]); break; } }
      }
    }
    // sections by header index
    const idx = (re, from = 0) => all.findIndex((l, i) => i >= from && re.test(l.text));
    // films
    const iPay = idx(/Payment Method Analysis - Box Office/);
    const reFilm = /^(.*?)\s+(\d{1,2}\/\d{1,2}\/\d{4})\s+(\d+)\s+([\d,]+)\s+([\d,]+)\s+([\d,]+)\s+(-?[\d,]+)\s+(-?[\d,]+)\s+([\d.]+)\s+([\d.]+)$/;
    let filmTotal = null;
    for (let i = 0; i < (iPay > 0 ? iPay : all.length); i++) {
      const t = all[i].text; const m = t.match(reFilm);
      if (m) out.films.push({ film: m[1].trim(), opening: m[2], week: +m[3], sessions: num(m[4]), adm: num(m[5]), comps: num(m[6]), nbo: num(m[7]) / 1000, gbo: num(m[8]) / 1000, occupancy: num(m[9]) / 100, atp: num(m[10]) });
      else if (/^Total\s/.test(t)) { const r = tail(t, 7); if (r) filmTotal = r.nums; }
    }
    if (filmTotal && out.films.length) {
      const s = out.films.reduce((a, f) => a + f.adm, 0);
      if (Math.abs(s - filmTotal[1]) > 0) out.warnings.push(`Tổng admit theo phim (${s}) lệch dòng Total (${filmTotal[1]})`);
    }
    // payments (two side-by-side tables)
    if (iPay >= 0) {
      const th = all.slice(iPay, iPay + 3).find((l) => l.cells.filter((c) => c.t === 'Payment Type').length >= 2);
      const cc = all[iPay].cells.find((c) => /Concessions/.test(c.t));
      const xs = (th ? th.cells.filter((c) => c.t === 'Payment Type')[1].x : (cc ? cc.x : 400)) - 6;
      let doneL = false, doneR = false;
      for (let i = iPay + 1; i < all.length && !(doneL && doneR); i++) {
        const l = all[i]; if (/Payment Type/.test(l.text)) continue;
        const L = textIn(l, 0, xs), R = textIn(l, xs, 9999);
        if (L && !doneL) { if (/^Total\b/.test(L)) doneL = true; else { const r = tail(L, 2); if (r) out.payBO.push({ method: r.name, value: r.nums[0] / 1000, pct: r.nums[1] / 100 }); } }
        if (R && !doneR) { if (/^Total\b/.test(R)) doneR = true; else { const r = tail(R, 2); if (r) out.payCO.push({ method: r.name, value: r.nums[0] / 1000, pct: r.nums[1] / 100 }); } }
      }
    }
    // sales channel totals
    const iCh = idx(/Sales Channel Analysis/);
    if (iCh >= 0) for (let i = iCh; i < all.length; i++) {
      const t = all[i].text; if (/^Total\s/.test(t)) { const r = tail(t, 6); if (r) { const n = r.nums; out.channel = [{ channel: 'Online', adm: n[0], nbo: n[1] / 1000 }, { channel: 'POS', adm: n[2], nbo: n[3] / 1000 }]; break; } }
    }
    // lead time by channel
    const BK = ['>4 ngày', '2–4 ngày', 'Hôm trước', 'Cùng ngày >2h', 'Cùng ngày 1–2h', 'Cùng ngày 15–60p', '15p cuối', 'Sau giờ chiếu'];
    const iLd = idx(/Analysis By Channel/);
    if (iLd >= 0) for (let i = iLd; i < Math.min(all.length, iLd + 12); i++) {
      const t = all[i].text; const ch = /^POS Sales\s/.test(t) ? 'POS' : /^Internet Ticketing\s/.test(t) ? 'Online' : null;
      if (ch) { const r = tail(t, 9); if (r) r.nums.slice(0, 8).forEach((v, j) => out.lead.push({ channel: ch, bucket: BK[j], order: j + 1, adm: v })); }
    }
    // group size
    const iG = idx(/Group Size Analysis/);
    if (iG >= 0) for (let i = iG; i < all.length; i++) {
      const t = all[i].text; if (/^Total\s/.test(t)) { const r = tail(t, 6); if (r) { const n = r.nums; out.group = { single: n[0], two: n[1], three: n[2], four: n[3], more: n[4], total_adm: n[5] }; break; } }
    }
    // concession class (left of "Top 10 Box Office Sundries")
    const iC = idx(/Concession Class Analysis/);
    if (iC >= 0) {
      const sc = all[iC].cells.find((c) => /Sundries/.test(c.t)); const xs = sc ? sc.x - 40 : 420;
      for (let i = iC + 1; i < all.length; i++) {
        const L = textIn(all[i], 0, xs); if (!L || /^Value\b/.test(L)) continue;
        if (/^Total\b/.test(L)) break;
        const r = tail(L, 3); if (r) out.cls.push({ item_class: r.name, net: r.nums[0] / 1000, pct: r.nums[1] / 100, per_admit: r.nums[2] });
      }
    }
    // top 10 concession items: three column groups
    const iT = idx(/Top 10 Concession Items/);
    if (iT >= 0) {
      const h = all.slice(iT, iT + 3).find((l) => /By Value/.test(l.text));
      const cq = h.cells.find((c) => /By Quantity/.test(c.t)), cv = h.cells.find((c) => /By Value/.test(c.t)), cm = h.cells.find((c) => /By Margin/.test(c.t));
      const bV = (cq.x1 + cv.x) / 2 + 40, bM = (cv.x1 + cm.x) / 2 + 40;
      // column starts: use the "Item" header cells
      const ih = all.slice(iT, iT + 4).find((l) => (l.text.match(/\bItem\b/g) || []).length >= 3);
      const starts = (ih ? ih.cells.filter((c) => c.t === 'Item').map((c) => c.x) : [0, bV, bM]).map((x, i) => (i ? x - 6 : x));
      const qty = [], val = [], mar = [];
      const s = all.indexOf(ih || h);
      for (let i = s + 1; i < all.length; i++) {
        const l = all[i];
        const a = textIn(l, 0, starts[1]), b = textIn(l, starts[1], starts[2]), c = textIn(l, starts[2], 9999);
        if (/^Total\b/.test(a) || /^Total\b/.test(b)) break;
        const ra = a && tail(a, 2), rb = b && tail(b, 2), rc = c && tail(c, 2);
        if (ra) qty.push({ item: ra.name, qty: ra.nums[0] }); if (rb) val.push({ item: rb.name, net: rb.nums[0] / 1000 }); if (rc) mar.push({ item: rc.name, margin: rc.nums[0] / 1000 });
      }
      out.items = val.map((v, i) => ({ rank: i + 1, item: v.item, net: v.net, margin: (mar.find((m) => m.item === v.item) || {}).margin ?? null, qty: (qty.find((q) => q.item === v.item) || {}).qty ?? null }));
      out.topQty = qty;
    }
    // top 20 ticket types: name, avg price, admits, admits %, net, gross, box office %
    const iTT = idx(/Top \d+ Ticket Types/);
    out.tickets = [];
    if (iTT >= 0) for (let i = iTT + 1; i < all.length; i++) {
      const t = all[i].text; if (/^Ticket Type\b/.test(t)) continue; if (/Marketing Report BO003|^Total\b/.test(t) || out.tickets.length >= 20) break;
      const r = tail(t, 6); if (r && r.name) out.tickets.push({ ticket_type: r.name, avg_price: r.nums[0], adm: r.nums[1], net: r.nums[3] / 1000, gross: r.nums[4] / 1000 });
    }
    // top 10 combo sales: name, qty, value

  const BK = { 'a. Payroll': 'payroll', 'Payroll for Manager': 'payroll_mgm', 'Payroll for cinema staff': 'payroll_staff', 'Staff cost / admit (nghìn đ)': 'scph', 'b. Stationary': 'stationery_total', 'c. Utilities': 'utilities', 'Electricity and power': 'electricity', 'Cleaning (dịch vụ & DCVS)': 'cleaning', 'Drinking': 'drinking', 'Others': 'others' };
  const ab = (o, f) => (o && fin(o[f]) ? Math.abs(o[f]) : null);
  const pa = (o, f) => (o && fin(o[f]) && o.adm ? (Math.abs(o[f]) * 1000) / o.adm : null);
  const v = (o, f) => (o && fin(o[f]) ? o[f] : null);
  const G = [
    ['a. Payroll', ab(cur, 'payroll'), null, cur.payroll_gap || (prev && prev.payroll_gap) ? null : ab(prev, 'payroll'), cur.payroll_gap || (ly && ly.payroll_gap) ? null : ab(ly, 'payroll'), 'f1', star(cur, 'payroll')],
    ['Payroll for Manager', ab(cur, 'payroll_mgm'), null, ab(prev, 'payroll_mgm'), ly && ly.payroll_gap ? null : ab(ly, 'payroll_mgm'), 'f1', star(cur, 'payroll_mgm'), 1],
    ['Payroll for cinema staff', ab(cur, 'payroll_staff'), st.std_payroll_staff ? Math.abs(st.std_payroll_staff) * n : null, ab(prev, 'payroll_staff'), ly && ly.payroll_gap ? null : ab(ly, 'payroll_staff'), 'f1', star(cur, 'payroll_staff'), 1],
    ['Lương phụ trội', ab(cur, 'payroll_ot'), null, ab(prev, 'payroll_ot'), ab(ly, 'payroll_ot'), 'f1', '', 1],
    ['Headcount quản lý', n === 1 ? v(cur, 'hc_mgm') : null, null, P.prevPairs.length === 1 ? v(prev, 'hc_mgm') : null, n === 1 ? v(ly, 'hc_mgm') : null, 'f0', '', 1],
    ['Headcount staff', n === 1 ? v(cur, 'hc_staff') : null, null, P.prevPairs.length === 1 ? v(prev, 'hc_staff') : null, n === 1 ? v(ly, 'hc_staff') : null, 'f0', '', 1],
    ['Giờ công staff', v(cur, 'hours_staff'), null, v(prev, 'hours_staff'), v(ly, 'hours_staff'), 'f0', '', 1],
    ['Staff cost / admit (nghìn đ)', cur.scph != null ? Math.abs(cur.scph) : null, null, prev && prev.scph != null ? Math.abs(prev.scph) : null, ly && !ly.payroll_gap && ly.scph != null ? Math.abs(ly.scph) : null, 'f2', '', 1],
    ['Staff cost / giờ công (nghìn đ)', cur.scph_hour != null ? Math.abs(cur.scph_hour) : null, null, prev && prev.scph_hour != null ? Math.abs(prev.scph_hour) : null, ly && ly.scph_hour != null ? Math.abs(ly.scph_hour) : null, 'fR', '', 1],
    ['b. Stationary', ab(cur, 'stationery_total'), null, ab(prev, 'stationery_total'), ab(ly, 'stationery_total'), 'f1', ''],
    ['Stationary / admit (nghìn đ)', pa(cur, 'stationery_total'), st.std_stationery_per_adm, pa(prev, 'stationery_total'), pa(ly, 'stationery_total'), 'f2', '', 1],
    ['c. Utilities', ab(cur, 'utilities'), null, ab(prev, 'utilities'), ab(ly, 'utilities'), 'f1', ''],
    ['Electricity and power', ab(cur, 'electricity'), null, ab(prev, 'electricity'), ab(ly, 'electricity'), 'f1', '', 1],
    ['Electricity index (kWh)', v(cur, 'elec_index'), null, v(prev, 'elec_index'), v(ly, 'elec_index'), 'f0', '', 2],
    ['kWh / Operation Hour', v(cur, 'elec_ph'), st.std_elec_idx_per_hour, v(prev, 'elec_ph'), v(ly, 'elec_ph'), 'fR', '', 2],
    ['Cleaning (dịch vụ & DCVS)', ab(cur, 'cleaning'), null, ab(prev, 'cleaning'), ab(ly, 'cleaning'), 'f1', star(cur, 'cleaning'), 1],
    ['Care', ab(cur, 'care'), st.std_care ? Math.abs(st.std_care) * n : null, ab(prev, 'care'), ab(ly, 'care'), 'f1', '', 2],
    ['Hygienic / admit (nghìn đ)', pa(cur, 'hygienic'), st.std_hygienic_per_adm, pa(prev, 'hygienic'), pa(ly, 'hygienic'), 'f2', '', 2],
    ['Rentokil', ab(cur, 'rentokil'), null, ab(prev, 'rentokil'), ab(ly, 'rentokil'), 'f1', '', 2],
    ['Chair cleaning', ab(cur, 'chair_clean'), null, ab(prev, 'chair_clean'), ab(ly, 'chair_clean'), 'f1', '', 2],
    ['Drinking', ab(cur, 'drinking'), null, ab(prev, 'drinking'), ab(ly, 'drinking'), 'f1', '', 1],
    ['Others', ab(cur, 'others'), null, ab(prev, 'others'), ab(ly, 'others'), 'f1', '', 1],
  ];
  const F = { f0, f1, f2, fR };
  const rows = G.map(([lab, a, s, p, l, f, stx, lv]) => { const g = fin(a) && fin(s) && s ? a / s - 1 : null; const cls = !fin(g) ? '' : g > 0.05 ? 'bad' : g < -0.05 ? 'good' : 'flat';
    const bk = BK[lab], bv = bp && bk && fin(bp[bk]) ? Math.abs(bp[bk]) : null; const gb = (lab === 'a. Payroll' && cur.payroll_gap) ? null : ch(a, bv);
    const hd = !lv; return `<tr class="${hd ? 'grp b' : 'l' + lv}"><td>${lab}${stx}</td><td>${F[f](a)}</td><td>${F[f](bv)}</td><td class="${tone('cost', gb)}">${dp(gb)}</td><td>${F[f](s)}</td><td class="${cls}">${dp(g)}</td><td>${F[f](p)}</td><td class="${tone('cost', ch(a, p))}">${dp(ch(a, p))}</td><td>${F[f](l)}</td><td class="${tone('cost', ch(a, l))}">${dp(ch(a, l))}</td></tr>`; }).join('');
  const t1 = `<div class="card tw"><table><thead><tr><th>Hạng mục</th><th>Actual</th><th>BP</th><th>vs BP</th><th>Standard</th><th>vs Std</th><th>Kỳ trước</th><th>vs kỳ trước</th><th>LY</th><th>vs LY</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  // kWh by band, 12 months: each bar = 100% of that month's kWh
  const kb = (y, m) => { const x = plGet(P.c, y, m); return x ? { m, low: Math.abs(x.kwh_low || 0), mid: Math.abs(x.kwh_mid || 0), peak: Math.abs(x.kwh_peak || 0) } : null; };
  const B = Array.from({ length: 12 }, (_, i) => kb(P.y, i + 1)).filter((b) => b && b.low + b.mid + b.peak > 0);
  const lyK = (m) => { const b = kb(P.y - 1, m); const t = b ? b.low + b.mid + b.peak : 0; return t || null; };
  // % từng khung làm tròn 1 lần; khung trung điểm = 100% − thấp − cao để 3 phần luôn cộng đủ 100%
  const shares = (b) => { const T = b.low + b.mid + b.peak; const pl = Math.round((b.low / T) * 100), pp = Math.round((b.peak / T) * 100); return { T, low: pl, peak: pp, mid: 100 - pl - pp }; };
  const seg = (val, pct, T, c) => `<div class="seg ${c}${pct < 10 ? ' sm' : ''}" style="width:${(val / T) * 100}%" title="${f0(val)} kWh · ${pct}%">${f0(val)} · ${pct}%</div>`;
  const band = B.length ? `<div class="card" style="margin-top:12px"><div class="ct">Điện theo khung giờ ${P.y} (kWh)</div>
  <div class="kwh"><div class="kh"><span>Tháng</span><span></span><span>Thấp điểm</span><span>Trung điểm</span><span>Cao điểm</span><span>Tổng kWh</span><span>LY</span><span>vs LY</span></div>
  ${B.map((b) => { const s = shares(b), T = s.T; return `<div class="kr${P.M.includes(b.m) ? ' on' : ''}"><span>${mlab(b.m)}</span><div class="bar2">${seg(b.low, s.low, T, 'c6')}${seg(b.mid, s.mid, T, 'c3')}${seg(b.peak, s.peak, T, 'c8')}</div><span>${f0(b.low)}</span><span>${f0(b.mid)}</span><span>${f0(b.peak)}</span><span><b>${f0(T)}</b></span><span>${f0(lyK(b.m))}</span><span class="${tone('cost', ch(T, lyK(b.m)))}">${dp(ch(T, lyK(b.m)))}</span></div>`; }).join('')}</div>
  <div class="lg"><span><i class="c6"></i>Thấp điểm</span><span><i class="c3"></i>Trung điểm</span><span><i class="c8"></i>Cao điểm</span></div></div>` : '';
  // monthly cost table grouped
  const ML = [['a. Payroll', 'payroll', 1], ['Payroll for Manager', 'payroll_mgm'], ['Lương phụ trội MGM', 'ot_mgm', 3], ['Payroll for cinema staff', 'payroll_staff'], ['Lương phụ trội staff', 'ot_staff', 3], ['b. Stationary', 'stationery_total', 1], ['c. Utilities', 'utilities', 1], ['Electricity and power', 'electricity'], ['Chỉ số điện (kWh)', 'elec_index', 4], ['kWh / Operation Hour', 'elec_ph', 5], ['Cleaning (dịch vụ & DCVS)', 'cleaning'], ['Care', 'care'], ['Others', 'others'], ['Controllable Cost', 'ctrl', 2]];
  const recs = Array.from({ length: 12 }, (_, i) => agg(P.c, P.y, [i + 1]));
  const yc = P.ytd, yl = P.ytdLy && !P.ytdLy.partial ? P.ytdLy : null; const okv = (o, f) => o && fin(o[f]) && !(['ctrl', 'payroll'].includes(f) && o.payroll_gap) ? Math.abs(o[f]) : null;
  const mt = `<div class="card tw" style="margin-top:12px"><div class="ct">Chi phí theo tháng ${P.y}</div><table><thead><tr><th>Hạng mục</th>${recs.map((x, i) => `<th class="${P.M.includes(i + 1) ? 'on' : ''}">${mlab(i + 1)}</th>`).join('')}<th class="sep">YTD</th><th>YTD LY</th><th>vs LY</th></tr></thead><tbody>${ML.map(([l, f, t]) => { const fm = t === 5 ? fR : f0; const ok = (x) => x && fin(x[f]) && !(f === 'ctrl' && x.payroll_gap); return `<tr class="${t === 2 ? 'tot' : t === 1 ? 'grp b' : t >= 3 ? 'l2' : 'l1'}"><td>${l}</td>${recs.map((x) => `<td>${ok(x) ? fm(Math.abs(x[f])) : '–'}</td>`).join('')}<td class="sep">${t === 5 ? fR(yc && yc.elec_ph) : fm(okv(yc, f))}</td><td>${t === 5 ? fR(yl && yl.elec_ph) : fm(okv(yl, f))}</td><td class="${tone('cost', ch(t === 5 ? yc && yc.elec_ph : okv(yc, f), t === 5 ? yl && yl.elec_ph : okv(yl, f)))}">${dp(ch(t === 5 ? yc && yc.elec_ph : okv(yc, f), t === 5 ? yl && yl.elec_ph : okv(yl, f)))}</td></tr>`; }).join('')}</tbody></table></div>`;
  return `${t1}${band}${mt}`;
}

/* nav scroll-spy */
function spy() {
  const links = [...document.querySelectorAll('.nav a')];
  const on = () => { let cur = SECS[0][0]; SECS.forEach(([id]) => { const e = document.getElementById(id); if (e && e.getBoundingClientRect().top < 140) cur = id; }); links.forEach((a) => a.classList.toggle('on', a.dataset.s === cur)); };
  window.onscroll = on; on();
}

/* P&L Monthly – controls, uploads, Firebase, Excel export */
const CDN = {
  pdf: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',

};
const FB_ROOT = 'plMonthly';
const loaded = {};
function loadJS(src) { return (loaded[src] = loaded[src] || new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('Không tải được thư viện: ' + src)); document.head.appendChild(s); })); }
function toast(t, ms = 2600) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), ms); }
function modal(html) { const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="mbox">${html}</div>`; m.addEventListener('click', (e) => { if (e.target === m || e.target.closest('[data-close]')) m.remove(); }); document.body.appendChild(m); return m; }

/* ---------- local cache ---------- */
function saveCache() { try { localStorage.setItem('plm_cache', JSON.stringify(S.up)); } catch (e) { console.warn(e); } }
function loadCache() { try { const c = JSON.parse(localStorage.getItem('plm_cache') || 'null'); if (c) S.up = { vista: c.vista || {}, bp: c.bp || {}, market: c.market || {}, hc: c.hc || {}, plan: c.plan || {} }; } catch (e) {} }

/* ---------- Firebase ---------- */
async function fbConnect() {
  const cfg0 = window.FIREBASE_CONFIG || null; setDot('off', 'Chưa kết nối Firebase'); if (!cfg0 || !cfg0.apiKey) return;
  try {
    const cfg = cfg0; for (const s of CDN.fb) await loadJS(s);
    const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg);
    try { await firebase.auth().signInAnonymously(); } catch (e) { console.warn('Anonymous auth chưa bật:', e.message); }
    const ref = firebase.database().ref(FB_ROOT); S.fb = ref;
    ref.on('value', (snap) => { const v = snap.val() || {}; S.up = { vista: v.vista || {}, bp: v.bp || {}, market: v.market || {}, hc: v.hc || {}, plan: v.plan || {} }; saveCache(); fillYears(); render(); setDot('ok', 'Đã đồng bộ Firebase'); },
      (err) => setDot('off', 'Firebase lỗi: ' + err.message));
  } catch (e) { setDot('off', 'Firebase lỗi: ' + e.message); }
}
function setDot(cls, t) { const d = $('#fbDot'); if (d) { d.className = 'dot ' + cls; d.parentElement.title = t; } }
async function persist(kind, obj) { // obj: {key: value}
  Object.assign(S.up[kind], obj); saveCache();
  if (S.fb) { const upd = {}; Object.entries(obj).forEach(([k, v]) => (upd[`${kind}/${k}`] = JSON.parse(JSON.stringify(v)))); await S.fb.update(upd); }
}

/* ---------- PDF upload ---------- */
async function pdfItems(file) {
  await loadJS(CDN.pdf); pdfjsLib.GlobalWorkerOptions.workerSrc = CDN.pdfWorker;
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise; const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) { const pg = await pdf.getPage(i); const vp = pg.getViewport({ scale: 1 }); const tc = await pg.getTextContent();
    pages.push({ w: vp.width, h: vp.height, items: tc.items.filter((it) => 'str' in it).map((it) => { const h = Math.hypot(it.transform[2], it.transform[3]) || it.height || 8; return { str: it.str, x: it.transform[4], w: it.width, y: vp.height - it.transform[5] - h * 0.8, h }; }) }); }
  return pages;
}
function cinemaFromName(nm) { const n = norm(nm); const c = CIN.find((c) => c.kw.some((k) => n.includes(k))); return c ? c.code : null; }
const cellVal = (v) => { if (v == null) return null; if (typeof v === 'object') { if (v instanceof Date) return v.toISOString(); if ('result' in v) return v.result ?? null; if (v.richText) return v.richText.map((t) => t.text).join(''); if ('text' in v) return v.text; if ('error' in v) return null; } return v; };
async function readBook(file, maxCols) {
  await loadJS(CDN.exceljs); const wb = new ExcelJS.Workbook(); await wb.xlsx.load(await file.arrayBuffer());
  const book = {}; wb.eachSheet((ws) => { const rows = []; const nr = ws.rowCount, nc = Math.min(ws.columnCount, maxCols); for (let r = 1; r <= nr; r++) { const row = ws.getRow(r); const a = []; for (let c = 1; c <= nc; c++) a.push(cellVal(row.getCell(c).value)); rows.push(a); } book[ws.name] = rows; });
  return book;
}
// One button: detect each file (Vista PDF, Ops Business Plan, Programming Monthly Report), preview, then save together.
async function uploadAny(files) {
  const m = modal(`<h3>Tải dữ liệu</h3><div id="upRes">Đang đọc ${files.length} file…</div><div class="mfoot"><button class="btn" data-close>Đóng</button><button class="btn pri" id="upSave" disabled>Lưu vào dữ liệu</button></div>`);
  const res = []; const save = { vista: {}, bp: {}, market: {}, hc: {}, plan: {} };
  for (const f of files) {
    const r = { file: f.name, type: '?', what: '', check: '', ok: false };
    try {
      if (/\.pdf$/i.test(f.name)) {
        const v = parseVista(await pdfItems(f)); v.file = f.name; v.cinema = cinemaFromName(v.cinemaName); v.uploadedAt = new Date().toISOString();
        if (!v.cinema) v.warnings.push('Không nhận ra rạp: ' + (v.cinemaName || '?')); if (!v.films.length) v.warnings.push('Không đọc được bảng phim');
        r.type = 'PDF Vista'; r.what = `${v.cinema || v.cinemaName || '?'} · ${v.month ? mlab(v.month) + '/' + v.year : '?'} · ${f0(v.kpi.adm)} admit · ${v.films.length} phim · ${v.tickets.length} ticket type · ${v.combos.length} combo`;
        r.ok = !!(v.cinema && v.year && v.month && v.kpi.adm); r.check = v.warnings.join('; '); r.note = (v.adjust || []).join('; ');
        if (r.ok) { if (vGet(v.cinema, v.year, v.month)) r.note = ['Ghi đè bản cũ', r.note].filter(Boolean).join('; '); save.vista[K(v.cinema, v.year, v.month)] = v; }
      } else if (/\.xlsx?$/i.test(f.name)) {
        const book = await readBook(f, 130);
        const isProg = Object.values(book).some((R) => R.slice(0, 5).some((row) => (row || []).some((x) => typeof x === 'string' && /PROGRAMMING MONTHLY REPORT/i.test(x))));
        if (isProg) {
          const p = parseProg(book); r.type = 'Programming Monthly Report';
          const own = p.months.map(([y, mm]) => `${mlab(mm)}/${y}`);
          r.what = `Thị phần ${p.months.length} tháng: ${own.join(', ')}`; r.ok = p.rows.length > 0; r.check = p.warnings.join('; ');
          p.rows.forEach((x) => { const k = x.year + '_' + x.month; (save.market[k] = save.market[k] || []).push(x); });
        } else if (Object.values(book).some((R) => R.some((row) => row && row.filter((x) => typeof x === 'string' && /^Lương hành chính/i.test(x.trim())).length >= 3))) {
          const p = parseHC(book); r.type = 'Lương & headcount';
          const by = {}; p.rows.forEach((x) => (by[x.cinema] = (by[x.cinema] || []).concat(mlab(x.month) + '/' + String(x.year).slice(2))));
          r.what = Object.entries(by).map(([k, ms]) => `${k}: ${ms[0]}–${ms[ms.length - 1]}`).join(' · '); r.ok = p.rows.length > 0; r.check = p.warnings.join('; ');
          p.rows.forEach((x) => (save.hc[K(x.cinema, x.year, x.month)] = x));
        } else if (Object.values(book).some((R) => R.slice(0, 15).some((row) => row && row.some((x) => typeof x === 'string' && /^Entity Code$/i.test(x.trim())) && row.some((x) => typeof x === 'string' && /Descriptions \(P&L\)/i.test(x))))) {
          const p = parsePlan(book); r.type = 'BP2026 Cinema';
          const by = {}; p.rows.forEach((x) => (by[x.cinema + ' ' + x.year] = (by[x.cinema + ' ' + x.year] || 0) + 1));
          r.what = Object.entries(by).map(([k, n]) => `${k}: ${n} tháng`).join(' · '); r.ok = p.rows.length > 0; r.check = p.warnings.join('; ');
          p.rows.forEach((x) => (save.plan[K(x.cinema, x.year, x.month)] = x));
        } else {
          const p = parseBP(book, CIN.map((c) => c.code));
          if (p.rows.length) { r.type = 'Ops Business Plan'; const by = {}; p.rows.forEach((x) => (by[x.cinema + ' ' + x.year] = (by[x.cinema + ' ' + x.year] || 0) + 1)); r.what = Object.entries(by).map(([k, n]) => `${k}: ${n} tháng`).join(' · '); r.ok = true; r.check = p.warnings.join('; '); p.rows.forEach((x) => (save.bp[K(x.cinema, x.year, x.month)] = x)); }
          else r.check = 'Không nhận ra loại file';
        }
      } else r.check = 'Chỉ nhận .pdf hoặc .xlsx';
    } catch (e) { r.check = e.message; }
    res.push(r);
  }
  $('#upRes', m).innerHTML = `<div class="tw"><table><thead><tr><th class="t">File</th><th class="t">Loại</th><th class="t">Nội dung</th><th class="t">Kiểm tra</th></tr></thead><tbody>${res.map((r) => `<tr><td class="t">${esc(r.file)}</td><td class="t">${esc(r.type)}</td><td class="t">${esc(r.what)}</td><td class="t">${r.ok ? (r.check ? `<span class="bad">${esc(r.check)}</span>` : `<span class="ok">Khớp</span>${r.note ? ` <span class="flat">· ${r.note}</span>` : ''}`) : `<span class="bad">${esc(r.check || 'Không đọc được')}</span>`}</td></tr>`).join('')}</tbody></table></div>${S.fb ? '' : '<div class="msg warn">Chưa kết nối Firebase: dữ liệu chỉ lưu trên máy này.</div>'}`;
  ['vista', 'bp', 'hc', 'plan'].forEach((k) => Object.keys(save[k]).forEach((key) => { if (!canSee(key.split('_')[0])) delete save[k][key]; })); // tài khoản rạp chỉ ghi số của rạp mình
  const b = $('#upSave', m); b.disabled = !res.some((r) => r.ok);
  b.onclick = async () => { b.disabled = true;
    try { for (const k of ['vista', 'bp', 'market', 'hc', 'plan']) if (Object.keys(save[k]).length) await persist(k, save[k]);
      m.remove(); toast('Đã lưu ' + res.filter((r) => r.ok).length + ' file'); fillYears();
      const v0 = Object.values(save.vista)[0]; if (v0 && canSee(v0.cinema)) { S.cin = v0.cinema; S.year = v0.year; S.months = [v0.month]; } render();
    } catch (e) { b.disabled = false; toast('Lỗi lưu: ' + e.message, 5000); } };
}

/* ---------- Data modal: status + Firebase ---------- */
function allYears() {

const XMLESC = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const colNum = (L) => L.split('').reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0);

// Sửa trực tiếp XML của sheet: giữ nguyên style, độ rộng cột, viền... của mẫu
class XSheet {
  constructor(xml) {
    const a = xml.indexOf('<sheetData'), b = xml.indexOf('</sheetData>');
    if (b < 0) { const e = xml.indexOf('/>', a); this.head = xml.slice(0, a); this.tail = xml.slice(e + 2); this.body = ''; }
    else { const s = xml.indexOf('>', a) + 1; this.head = xml.slice(0, a); this.tail = xml.slice(b + 12); this.body = xml.slice(s, b); }
    this.rows = new Map();
    const reRow = /<row\b([^>]*?)(?:\/>|>([\s\S]*?)<\/row>)/g; let m;
    while ((m = reRow.exec(this.body))) {
      const r = +/\br="(\d+)"/.exec(m[1])[1]; const cells = new Map();
      const reC = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g; let c;
      while ((c = reC.exec(m[2] || ''))) { const ref = /\br="([A-Z]+)\d+"/.exec(c[1])[1]; cells.set(colNum(ref), { attrs: c[1], inner: c[2] || '' }); }
      this.rows.set(r, { attrs: m[1], cells });
    }
  }
  _get(ref) { const m = /^([A-Z]+)(\d+)$/.exec(ref); const col = colNum(m[1]), r = +m[2];
    if (!this.rows.has(r)) this.rows.set(r, { attrs: ` r="${r}"`, cells: new Map() });
    const row = this.rows.get(r); if (!row.cells.has(col)) row.cells.set(col, { attrs: ` r="${ref}"`, inner: '' }); return row.cells.get(col); }
  style(ref) { const m = /\bs="(\d+)"/.exec(this._get(ref).attrs); return m ? +m[1] : 0; }
  // v: số | chuỗi | {f: 'công thức'} | null (để trống, giữ định dạng)
  set(ref, v, s) {
    const c = this._get(ref); const st = s != null ? s : this.style(ref);
    let attrs = ` r="${ref}"${st ? ` s="${st}"` : ''}`, inner = '';
    if (v && typeof v === 'object' && v.f) inner = `<f>${XMLESC(v.f.replace(/^=/, ''))}</f>`;
    else if (typeof v === 'number' && isFinite(v)) inner = `<v>${v}</v>`;
    else if (typeof v === 'string' && v !== '') { attrs += ' t="inlineStr"'; inner = `<is><t xml:space="preserve">${XMLESC(v)}</t></is>`; }
    c.attrs = attrs; c.inner = inner;
  }
  merge(a, b) { (this.merges = this.merges || []).push(`${a}:${b}`); }
  height(r, h) { this._get('A' + r); const row = this.rows.get(r); row.attrs = row.attrs.replace(/\s(ht|customHeight)="[^"]*"/g, '') + ` ht="${h}" customHeight="1"`; }
  clearFrom(r0) { [...this.rows.keys()].forEach((r) => { if (r >= r0) this.rows.delete(r); }); }
  maxRow() { return Math.max(0, ...[...this.rows.entries()].filter(([, x]) => [...x.cells.values()].some((c) => c.inner)).map(([r]) => r)); }
  toString() {
    const rows = [...this.rows.entries()].sort((a, b) => a[0] - b[0]).map(([r, x]) => {
      const cs = [...x.cells.entries()].sort((a, b) => a[0] - b[0]).map(([, c]) => (c.inner ? `<c${c.attrs}>${c.inner}</c>` : `<c${c.attrs}/>`)).join('');
      return `<row${x.attrs}>${cs}</row>`; }).join('');
    const head = this.head.replace(/<dimension ref="[^"]*"\/>/, `<dimension ref="A1:T${Math.max(1, this.maxRow())}"/>`);
    const mg = this.merges && this.merges.length ? `<mergeCells count="${this.merges.length}">${this.merges.map((m) => `<mergeCell ref="${m}"/>`).join('')}</mergeCells>` : '';
    return `${head}<sheetData>${rows}</sheetData>${mg}${this.tail}`;
  }
}

// thêm style mới = clone style có sẵn, đổi định dạng số
function xStyles(xml) {
  let n = +/<cellXfs count="(\d+)"/.exec(xml)[1]; const a = xml.indexOf('<cellXfs'), b = xml.indexOf('</cellXfs>');
  const xfs = xml.slice(xml.indexOf('>', a) + 1, b).match(/<xf\b[^>]*?(?:\/>|>[\s\S]*?<\/xf>)/g); const add = [];
  const clone = (base, fmt) => { let x = xfs[base].replace(/numFmtId="\d+"/, `numFmtId="${fmt}"`); if (!/applyNumberFormat/.test(x)) x = x.replace('<xf ', '<xf applyNumberFormat="1" '); add.push(x); return n + add.length - 1; };
  const extra = { fonts: [], fills: [], borders: [] }, base = {};
  ['fonts', 'fills', 'borders'].forEach((k) => (base[k] = +new RegExp(`<${k} count="(\\d+)"`).exec(xml)[1]));
  const pushPart = (k, s) => { const i = extra[k].indexOf(s); if (i >= 0) return base[k] + i; extra[k].push(s); return base[k] + extra[k].length - 1; };
  const font = ({ b, i, sz = 11, color = 'FF17191C' }) => pushPart('fonts', `<font>${b ? '<b/>' : ''}${i ? '<i/>' : ''}<sz val="${sz}"/><color rgb="${color}"/><name val="Calibri"/><family val="2"/></font>`);
  const fill = (rgb) => (rgb ? pushPart('fills', `<fill><patternFill patternType="solid"><fgColor rgb="${rgb}"/><bgColor indexed="64"/></patternFill></fill>`) : 0);
  const side = (t) => `<${t} style="thin"><color rgb="FFBFBFBF"/></${t}>`;
  const border = (on) => (on ? pushPart('borders', `<border>${side('left')}${side('right')}${side('top')}${side('bottom')}<diagonal/></border>`) : 0);
  // style mới: {b,i,sz,color,fill,border,fmt,h,v,wrap}
  const make = (o = {}) => { add.push(`<xf numFmtId="${o.fmt || 0}" fontId="${font(o)}" fillId="${fill(o.fill)}" borderId="${border(o.border)}" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="${o.h || 'general'}" vertical="${o.v || 'center'}"${o.wrap ? ' wrapText="1"' : ''}/></xf>`); return n + add.length - 1; };
  const done = () => { let s = xml;
    ['fonts', 'fills', 'borders'].forEach((k) => { if (!extra[k].length) return; s = s.replace(new RegExp(`<${k} count="\\d+"`), `<${k} count="${base[k] + extra[k].length}"`).replace(`</${k}>`, extra[k].join('') + `</${k}>`); });
    return s.replace(/<cellXfs count="\d+">/, `<cellXfs count="${n + add.length}">`).replace('</cellXfs>', add.join('') + '</cellXfs>'); };
  return { clone, make, done };
}

function fillCinema(sh, ci, P, S0) {

  put('B1', `Cinema Monthly P&L Report - ${lab}`);

  // ---- 1. Overall ----
  const ok = (o) => (o && !(o.partial > 0) ? o : null);
  const cols = [['C', P.cur], ['D', P.bp], ['E', P.prev], ['F', P.ly], ['L', P.ytd], ['M', P.bpY], ['N', ok(P.ytdLy)]];
  const OV = [[7, 'adm'], [10, 'nbo'], [13, 'nco'], [15, 'strike_trans'], [16, 'strike_adm'], [17, 'bill'], [21, 'payroll_mgm'], [22, 'payroll_staff'], [24, 'stationery_total'], [26, 'electricity'], [27, 'cleaning'], [28, 'others']];
  cols.forEach(([L, o]) => OV.forEach(([r, k]) => {

    put(L + r, num(v)); }));

      return [t.ticket_type, t.adm, t.net, p ? p.adm : f ? f.adm_lm : null, p ? p.net : f ? f.nbo_lm : null, l ? l.adm : f ? f.adm_ly : null, l ? l.net : f ? f.nbo_ly : null]; }); }
  else if (ref.length) TT = ref.slice(0, 10).map((r) => [r.ticket_type, r.adm_tm, r.nbo_tm, r.adm_lm, r.nbo_lm, r.adm_ly, r.nbo_ly]);
  for (let i = 0; i < 10; i++) { const r = 40 + i, t = TT[i] || [];

  // ---- 3. CO sale by item class (nghìn VND, như mẫu) ----
  const online = (v) => (v ? (v.channel.find((x) => x.channel === 'Online') || {}).adm ?? null : null);
  const YT = (() => { const v = vistaPeriod(c, y, P.ytdM); return v && v.complete ? v : null; })(), YL = (() => { const v = vistaPeriod(c, y - 1, P.ytdM); return v && v.complete ? v : null; })();
  put('C60', online(Vc)); put('D60', online(VP)); put('E60', online(VL)); put('L60', online(YT)); put('M60', online(YL));
  const CL = [[64, 'CO Combo'], [65, 'CO Drinks'], [66, 'CO Food'], [67, 'CO Online'], [68, 'Khác'], [69, 'Cine Munch/Blv'], [70, 'Movie Combo']];
  const BASE = ['CO Combo', 'CO Drinks', 'CO Food', 'CO Online', 'Movie Combo'];

  const clsOf = (v) => { if (!v) return null; const o = {}; BASE.forEach((k) => (o[k] = v.cls[k] ?? null)); let fb = 0, ot = 0, anyO = false;

  put('D128', num(sd.std_stationery_per_adm));
  const g = (o, k) => (o && fin(o[k]) ? o[k] : null);
  put('C139', g(P.cur, 'elec_index')); put('F139', g(P.prev, 'elec_index')); put('N139', g(P.ytd, 'elec_index')); put('O139', null);
  put('C140', g(P.cur, 'op_hour')); put('F140', g(P.prev, 'op_hour')); put('N140', g(P.ytd, 'op_hour')); put('O140', null);
  put('D141', num(sd.std_elec_idx_per_hour)); put('O141', sd.std_elec_idx_per_hour ? { f: '=D141' } : null);
  put('C143', neg(g(P.cur, 'care'))); put('D143', sd.std_care ? neg(sd.std_care) * n : null); put('F143', neg(g(P.prev, 'care'))); put('N143', neg(g(P.ytd, 'care'))); put('O143', sd.std_care ? neg(sd.std_care) * nY : null);
  put('C144', neg(g(P.cur, 'hygienic'))); put('F144', neg(g(P.prev, 'hygienic'))); put('N144', neg(g(P.ytd, 'hygienic')));
  put('D145', num(sd.std_hygienic_per_adm)); put('O145', num(sd.std_hygienic_per_adm));
  put('C146', neg(g(P.cur, 'rentokil'))); put('F146', neg(g(P.prev, 'rentokil'))); put('N146', neg(g(P.ytd, 'rentokil')));
  put('C147', neg(g(P.cur, 'chair_clean'))); put('F147', neg(g(P.prev, 'chair_clean'))); put('N147', neg(g(P.ytd, 'chair_clean')));
  // ---- phần bổ sung bên dưới mẫu ----
  extras(sh, ci, P, V, VL, S0);
  return { adm: 'C7', rev: 'C8', atp: 'C11', spp: 'C14', ctrl: 'C19', revLy: 'F8', revVsLy: 'I8' };
}

function extras(sh, ci, P, V, VL, S0) {
  const c = ci.code; let r = 152;
  const sec = (t) => { sh.set('B' + r, t, S0.sec); r += 2; };
  const head = (labels) => { labels.forEach((l, i) => sh.set(colLet(2 + i) + r, l, S0.head)); r++; };
  const row = (vals, styles, bold) => { vals.forEach((v, i) => { const s = i === 0 ? (bold ? S0.labB : S0.lab) : styles[i - 1] != null ? S0[styles[i - 1] + (bold && S0[styles[i - 1] + 'B'] ? 'B' : '')] : S0.int; sh.set(colLet(2 + i) + r, fin(v) || typeof v === 'string' ? v : v && v.f ? v : null, s); }); r++; };
  const F = (f) => ({ f });
  const NT = sectionNotes(c, P, V);
  // Market share
  const mk = marketView(c, P);
  sec('Market share' + (ci.cluster ? ' - cụm ' + ci.cluster : ''));
  if (mk && mk.months.length) { head(['Rạp', 'Admission', '% Adm', 'Admission LY', '% Adm LY', 'vs LY (điểm)']); const r0 = r, r1 = r + mk.rows.length - 1;
    mk.rows.forEach((x) => row([x.exhibitor, x.adm, F(`=IFERROR(C${r}/SUM($C$${r0}:$C$${r1}),"-")`), mk.lyOk ? x.adm_ly ?? 0 : null, F(`=IFERROR(E${r}/SUM($E$${r0}:$E$${r1}),"-")`), F(`=IFERROR(D${r}-F${r},"-")`)], ['int', 'pct', 'int', 'pct', 'pct'], x.me)); }
  else row(['Chưa có số thị phần cho kỳ này'], []);
  r++; NT.market.forEach((f) => noteRow(f)); r += 2;
  // Top film
  sec('Top film');
  if (V && V.films.length) { head(['Phim', 'Suất', 'Admit', '% Admit', 'Admit/suất', 'NBO', 'ATP', 'Khởi chiếu', 'Loại', 'Admit LY']); const L = VL ? Object.fromEntries(VL.films.map((f) => [f.film, f.adm])) : {}; const r0 = r, list = V.films.slice(0, 15), r1 = r + list.length - 1;
    list.forEach((f) => { const nw = isNewFilm(f, P.y, P.M); row([f.film, f.sessions, f.adm, F(`=IFERROR(D${r}/SUM($D$${r0}:$D$${r1}),"-")`), F(`=IFERROR(D${r}/C${r},"-")`), f.nbo, F(`=IFERROR(G${r}/D${r}*10^3,"-")`), f.opening || '', nw === true ? 'Mới' : nw === false ? 'Chuyển tiếp' : '', L[f.film] ?? null], ['int', 'int', 'pct', 'dec1', 'int', 'dec1', 'int', 'int', 'int']); });
    const nN = V.films.filter((f) => isNewFilm(f, P.y, P.M) === true);
    row(['Số lượng film', V.films.length], ['int'], true); row(['Film mới khởi chiếu trong kỳ', nN.length], ['int']); row(['Film chuyển tiếp từ kỳ trước', V.films.length - nN.length], ['int']);
    row(['% admit từ film mới', nN.reduce((a, f) => a + f.adm, 0) / V.films.reduce((a, f) => a + f.adm, 0)], ['pct']); }
  else row(['Chưa có PDF Vista cho kỳ này'], []);
  r++; NT.film.forEach((f) => noteRow(f)); r += 2;
  // Top 10 CO items
  sec('Top 10 CO items');
  if (V && V.combos.length) { head(['Item', 'SL', 'Net', '% NCO', 'SPP', 'SL LY', 'Net LY', 'vs LY']); const L = VL ? Object.fromEntries(VL.combos.map((q) => [q.item, q])) : {}; const r0 = r;
    V.combos.slice(0, 10).forEach((x) => { const l = L[x.item]; row([x.item, x.qty, x.net, F(`=IFERROR(D${r}/${V.co_net},"-")`), F(`=IFERROR(D${r}*1000/${V.adm},"-")`), l ? l.qty : null, l ? l.net : null, F(`=IFERROR(D${r}/H${r}-1,"-")`)], ['int', 'int', 'pct', 'dec2', 'int', 'int', 'pct']); });
    row(['Tổng top 10', F(`=SUM(C${r0}:C${r - 1})`), F(`=SUM(D${r0}:D${r - 1})`), F(`=IFERROR(D${r}/${V.co_net},"-")`), F(`=IFERROR(D${r}*1000/${V.adm},"-")`), null, F(`=IF(COUNT(H${r0}:H${r - 1})=0,"",SUM(H${r0}:H${r - 1}))`), F(`=IFERROR(D${r}/H${r}-1,"-")`)], ['int', 'int', 'pct', 'dec2', 'int', 'int', 'pct'], true);
    if (V.items.length) { r++; head(['Top 10 món theo doanh thu', 'Net', 'Margin', '% Margin']); V.items.forEach((x) => row([x.item, x.net, x.mOk ? x.margin : null, F(`=IFERROR(D${r}/C${r},"-")`)], ['int', 'int', 'pct'])); } }
  else row(['Chưa có số top combo cho kỳ này'], []);
  r++; NT.coitems.forEach((f) => noteRow(f)); r += 2;
  // Chi phí theo tháng
  sec(`Chi phí theo tháng ${P.y} (triệu VND)`);
  const mx = Math.max(...P.M), recs = Array.from({ length: 12 }, (_, i) => agg(c, P.y, [i + 1])), ly = P.ytdLy && !P.ytdLy.partial ? P.ytdLy : null;
  head(['Hạng mục', ...Array.from({ length: 12 }, (_, i) => mlab(i + 1)), `YTD ${mlab(1)}–${mlab(mx)}`, 'YTD LY', 'vs LY']);
  const LE = colLet(2 + mx);
  const ML = [['Payroll', 'payroll', 1], ['Payroll for Manager', 'payroll_mgm'], ['Lương phụ trội MGM', 'ot_mgm'], ['Payroll for cinema staff', 'payroll_staff'], ['Lương phụ trội staff', 'ot_staff'], ['Stationary', 'stationery_total', 1], ['Utilities', 'utilities', 1], ['Electricity and power', 'electricity'], ['Electricity index (kWh)', 'elec_index', 0, 'int'], ['Operation Hour', 'op_hour', 0, 'int'], ['Cleaning (dịch vụ & DCVS)', 'cleaning'], ['Care', 'care'], ['Others', 'others'], ['kWh thấp điểm', 'kwh_low', 0, 'int'], ['kWh trung điểm', 'kwh_mid', 0, 'int'], ['kWh cao điểm', 'kwh_peak', 0, 'int']];
  ML.forEach(([l, f, b, fmt]) => { const ab = (o) => (o && fin(o[f]) && o[f] !== 0 && !(['payroll', 'payroll_mgm', 'payroll_staff'].includes(f) && o.payroll_gap) ? Math.abs(o[f]) : null); const ty = fmt || 'int';
    row([l, ...recs.map(ab), F(`=IF(COUNT(C${r}:${LE}${r})=0,"",SUM(C${r}:${LE}${r}))`), ab(ly), F(`=IFERROR(O${r}/P${r}-1,"-")`)], [...Array(13).fill(ty), ty, 'pct'], !!b); });
  row(['Tổng kWh theo khung giờ', ...Array.from({ length: 12 }, (_, i) => F(`=IF(COUNT(${colLet(3 + i)}${r - 3}:${colLet(3 + i)}${r - 1})=0,"",SUM(${colLet(3 + i)}${r - 3}:${colLet(3 + i)}${r - 1}))`)), F(`=IF(COUNT(C${r}:${LE}${r})=0,"",SUM(C${r}:${LE}${r}))`)], Array(13).fill('int'), true);
  r++; NT.opex.forEach((f) => noteRow(f)); r += 2;
  // Điểm cần lưu ý chung
  sec('Điểm cần lưu ý');
  [['Overall', NT.overall], ['Ticket type', NT.ticket], ['CO sale by item class', NT.coclass]].forEach(([t, L]) => { if (!L.length) return; sh.set('B' + r, t, S0.labB); r++; L.forEach((f) => noteRow(f)); r++; });
  function noteRow(f) { const LV = { bad: 'Cần xử lý', warn: 'Lưu ý', good: 'Tốt', flat: 'Theo dõi' }; sh.set('B' + r, LV[f.lv], S0.lab); sh.set('C' + r, noPlus(f.text + (f.action ? '  → ' + f.action : '')), S0.lab); r++; }
}

function fillSummary(sh, vis, refs, st, per) {
  const T = {
    title: st.make({ b: 1, sz: 14 }), sub: st.make({ i: 1, sz: 10, color: 'FF6B7078' }), sec: st.make({ b: 1, sz: 12, color: 'FF1F4E79' }),
    head: st.make({ b: 1, fill: 'FFF2F2F2', border: 1, h: 'center', wrap: 1 }), headL: st.make({ b: 1, fill: 'FFF2F2F2', border: 1, h: 'left', wrap: 1 }),
    name: st.make({ border: 1, h: 'left' }), nameB: st.make({ b: 1, border: 1, h: 'left', v: 'top', wrap: 1 }),
    int: st.make({ border: 1, h: 'right', fmt: 3 }), dec: st.make({ border: 1, h: 'right', fmt: 166 }), neg: st.make({ border: 1, h: 'right', fmt: 37 }), pct: st.make({ border: 1, h: 'right', fmt: 164 }),
    txt: st.make({ border: 1, h: 'left', v: 'top', wrap: 1 }), ctr: st.make({ border: 1, h: 'center', v: 'top', wrap: 1 }),
    bad: st.make({ b: 1, border: 1, h: 'center', v: 'top', color: 'FFB3402F' }), warn: st.make({ b: 1, border: 1, h: 'center', v: 'top', color: 'FFB7791F' }),
  };
  const many = vis.length > 1;
  sh.set('B1', `Tóm tắt P&L – ${many ? 'Khu vực ' + vis.length + ' rạp' : vis[0].name} · ${per}`, T.title); sh.height(1, 22);
  sh.set('B2', 'Triệu VND; ATP, SPP: nghìn VND. Số liệu liên kết từ từng sheet rạp.', T.sub);
  // 1. Kết quả kỳ
  let r = 4; sh.set('B' + r, '1. Kết quả kỳ', T.sec); r++;
  ['Rạp', 'Admission', 'Total Revenue', 'ATP', 'SPP', 'Controllable Cost', '% Cost / Revenue', 'Revenue LY', 'Revenue vs LY'].forEach((l, i) => sh.set(colLet(2 + i) + r, l, i ? T.head : T.headL)); sh.height(r, 30); r++;
  vis.forEach((ci) => { const s = refs[ci.code], q = (x) => ({ f: `=IF('${ci.code}'!${x}="","",'${ci.code}'!${x})` });
    sh.set('B' + r, ci.name, T.name); sh.set('C' + r, q(s.adm), T.int); sh.set('D' + r, q(s.rev), T.int); sh.set('E' + r, q(s.atp), T.dec); sh.set('F' + r, q(s.spp), T.dec); sh.set('G' + r, q(s.ctrl), T.neg);
    sh.set('H' + r, { f: `=IFERROR(-G${r}/D${r},"-")` }, T.pct); sh.set('I' + r, q(s.revLy), T.int); sh.set('J' + r, { f: `=IFERROR(D${r}/I${r}-1,"-")` }, T.pct); sh.height(r, 18); r++; });
  // 2. Phát hiện & action plan
  r += 2; sh.set('B' + r, '2. Phát hiện & action plan', T.sec); r++;
  sh.set('B' + r, 'Rạp', T.headL); sh.set('C' + r, 'Hạng mục', T.head); sh.set('D' + r, 'Mức', T.head);
  sh.set('E' + r, 'Phát hiện', T.headL); ['F', 'G', 'H'].forEach((L) => sh.set(L + r, null, T.head)); sh.merge('E' + r, 'H' + r);
  sh.set('I' + r, 'Hành động đề xuất', T.headL); ['J', 'K'].forEach((L) => sh.set(L + r, null, T.head)); sh.merge('I' + r, 'K' + r);
  sh.set('L' + r, 'Phụ trách', T.head); sh.set('M' + r, 'Hạn', T.head); sh.height(r, 22); r++;
  const SN = { overall: 'Overall', market: 'Market share', film: 'Top film', ticket: 'Ticket type', coclass: 'CO class', coitems: 'Top 10 CO', opex: 'OPEX' };
  let any = false;
  vis.forEach((ci) => { const P = period(ci.code); if (!P.cur) return; const NT = sectionNotes(ci.code, P, vistaPeriod(ci.code, P.y, P.M));
    const L = Object.entries(NT).flatMap(([s, l]) => l.filter((f) => f.lv === 'bad' || f.lv === 'warn').map((f) => ({ ...f, s }))).sort((a, b) => (a.lv === 'bad' ? 0 : 1) - (b.lv === 'bad' ? 0 : 1));
    if (!L.length) return; any = true; const r0 = r;
    L.forEach((f) => { const t = noPlus(f.text), a = f.action ? noPlus(f.action) : '–';
      sh.set('B' + r, r === r0 ? ci.name : null, T.nameB); sh.set('C' + r, SN[f.s], T.ctr); sh.set('D' + r, f.lv === 'bad' ? 'Cần xử lý' : 'Lưu ý', f.lv === 'bad' ? T.bad : T.warn);
      sh.set('E' + r, t, T.txt); ['F', 'G', 'H'].forEach((X) => sh.set(X + r, null, T.txt)); sh.merge('E' + r, 'H' + r);
      sh.set('I' + r, a, T.txt); ['J', 'K'].forEach((X) => sh.set(X + r, null, T.txt)); sh.merge('I' + r, 'K' + r);
      sh.set('L' + r, f.action ? 'CM ' + ci.code : null, T.ctr); sh.set('M' + r, null, T.ctr);
      sh.height(r, Math.max(18, 15 * Math.max(Math.ceil(t.length / 58), Math.ceil(a.length / 43)) + 3)); r++; });
    if (r - 1 > r0) sh.merge('B' + r0, 'B' + (r - 1)); });
  if (!any) { sh.set('B' + r, 'Không có điểm cần xử lý trong kỳ.', T.txt); }
}

  { role: 'AM', label: 'Area Manager', user: 'duynh', hash: '6bd196cc14c8a3d0ec552cf8f16bfeee125830b9c277113ce7cccecac0887dd8', cinemas: ['QT', 'TC', 'NVQ', 'TrC', 'PHI', 'BRI'] },

  { role: 'TC', label: 'Rạp Trung Chánh', user: 'vanttt', hash: 'ad0252dda39c432958ef61d04d55b880d4cb00d26197380a33d5d1fbc222033c', cinemas: ['TC'] },
  { role: 'NVQ', label: 'Rạp Nguyễn Văn Quá', user: 'thynbu', hash: '055dfa4eedd8737e825644cdc0cc8a9f0efb90fdb4ef204ed8c5d9f65a1d62a1', cinemas: ['NVQ'] },

  { role: 'BRI', label: 'Rạp Bà Rịa', user: 'tronglt', hash: 'c92caa467602ae1534618f797c2442a3d79d31f9e8f8abe9fe2b21303c915c24', cinemas: ['BRI'] },
  { role: 'PHI', label: 'Rạp Phan Huy Ích', user: 'thanhhv', hash: 'ad73bdb36e160ca7665af98b856a3430f215c6803f31ed08a5ebf5b46b6ccf89', cinemas: ['PHI'] },
];
const AUTH_KEY = 'plm_auth';
async function sha256(t) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join(''); }
// Luôn khóa: không lưu phiên đăng nhập; trình duyệt chỉ gợi ý lưu tài khoản/mật khẩu
try { localStorage.removeItem(AUTH_KEY); sessionStorage.removeItem(AUTH_KEY); } catch (e) {}
function logout() { location.reload(); }
function lockScreen() {
  const roles = [...new Set(ACCOUNTS.map((a) => a.role))];
  const el = document.createElement('div'); el.className = 'lock';
  el.innerHTML = `<form class="lbox" autocomplete="on"><div class="lbrand">P&L Monthly</div><div class="lsub">Galaxy Cinema · Cinema Monthly P&L</div>
    <label>Vai trò<select id="lRole">${roles.map((r) => `<option value="${r}">${esc(ACCOUNTS.find((a) => a.role === r).label)}</option>`).join('')}</select></label>
    <label>Tài khoản<input id="lUser" name="username" autocomplete="username" required></label>
    <label>Mật khẩu<input id="lPass" name="password" type="password" autocomplete="current-password" required></label>
    <div class="lerr" id="lErr" role="alert"></div><button class="btn pri" type="submit">Đăng nhập</button></form>`;
  document.body.appendChild(el); document.body.classList.add('locked');
  setTimeout(() => el.querySelector('#lUser').focus(), 50);
  el.querySelector('#lUser').addEventListener('change', (e) => { const acc = ACCOUNTS.find((x) => x.user === e.target.value.trim()); if (acc) el.querySelector('#lRole').value = acc.role; });
  el.querySelector('form').onsubmit = async (e) => { e.preventDefault();
    const role = el.querySelector('#lRole').value, user = el.querySelector('#lUser').value.trim(), pass = el.querySelector('#lPass').value;
    const hash = await sha256(user + ':' + pass); const acc = ACCOUNTS.find((a) => a.role === role && a.user === user && a.hash === hash);
    if (!acc) { el.querySelector('#lErr').textContent = 'Sai tài khoản hoặc mật khẩu.'; el.querySelector('#lPass').value = ''; el.querySelector('#lPass').focus(); return; }
    
    el.remove(); document.body.classList.remove('locked'); startApp(acc); };
}
function startApp(acc) {
  window.ACC = acc;
  const u = document.getElementById('bOut'); if (u) { u.querySelector('span').textContent = acc.user + ' · ' + (acc.role === 'AM' ? 'AM' : acc.label.replace('Rạp ', '')); u.onclick = logout; }
  init();
}
document.addEventListener('DOMContentLoaded', lockScreen);
